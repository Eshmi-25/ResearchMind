services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchmind-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  frontend:
    image: node:22-alpine
    container_name: researchmind-frontend
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: researchmind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
